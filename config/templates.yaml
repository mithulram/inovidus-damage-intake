    greeting: "Hello,"
    closing: "Kind regards,\nYour property management team"
    receipt: "Thank you for your message. We have received your damage report."
    out_of_scope: "We are forwarding your message to {route_to}."
    emergency: "We will attend to your report immediately."
    confirm_unit: "Please confirm your floor and the side of your apartment (left, right or centre). We use German floor numbering: ground floor = EG, the floor above = 1. OG."
    confirm_identity: "Please provide the contract holder's full name or your contract number."
    confirm_address: "Please provide your full address and your full name."
