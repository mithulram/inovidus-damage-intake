    ask_registered_email: "Please write to us again from the email address registered with us."
# Übersetzungen der konfigurierten deutschen Ziel- und Sicherheitstexte.
# Unbekannte, neu konfigurierte Texte bleiben im Original erhalten.
translations:
  en:
    "Mietbuchhaltung": "rent accounting"
    "Kundenservice": "customer service"
    "sofort – Notdienst innerhalb von 2 Stunden": "immediately – emergency service within 2 hours"
    "Handwerker innerhalb von 24 Stunden": "a contractor within 24 hours"
    "innerhalb von 5 Werktagen": "within 5 working days"
    "Kein Licht und keine elektrischen Schalter betätigen, kein offenes Feuer.": "Do not operate lights or electrical switches; avoid naked flames."
    "Fenster öffnen, Gebäude verlassen, Nachbarn warnen.": "Open windows, leave the building and warn neighbours."
    "Von draußen den Gas-Notdienst des Versorgers oder 112 anrufen.": "From outside, call the gas supplier's emergency service or 112."
    "Wenn möglich den Haupt-Wasserhahn bzw. das Eckventil zudrehen.": "If possible, close the main water valve or the local shut-off valve."
    "Elektrische Geräte in der Nähe des Wassers nicht berühren, ggf. Sicherung ausschalten.": "Do not touch electrical devices near water; switch off the circuit breaker if safe."
    "Wasser mit Eimern/Tüchern auffangen und Fotos machen.": "Collect water with buckets or towels and take photos."
    "Betroffene Sicherung ausschalten, nichts Nasses berühren.": "Switch off the affected circuit breaker; do not touch anything wet."
    "Bei Rauch, Brandgeruch oder Gefahr sofort 112 anrufen.": "If there is smoke, a burning smell or danger, call 112 immediately."
